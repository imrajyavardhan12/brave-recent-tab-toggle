name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: make test
      - name: Package extension
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: recent-tab-toggle-extension
          path: dist/*.zip
          if-no-files-found: error
