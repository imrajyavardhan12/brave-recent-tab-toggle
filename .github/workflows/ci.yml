name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install quality tools
        run: brew list actionlint ruff shellcheck >/dev/null 2>&1 || brew install actionlint ruff shellcheck
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recent-tab-toggle-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
