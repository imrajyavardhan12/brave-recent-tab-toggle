name: Bug report
description: Report incorrect toggle, helper, or installation behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please avoid including sensitive tab titles or URLs.
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: brave
    attributes:
      label: Brave version
      description: Copy from brave://version
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Popup helper status
      options: [Connected, Disconnected, Shortcut conflict, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `make test` if I changed the source.
        - label: I have not included private browsing data.
          required: true
